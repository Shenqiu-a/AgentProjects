user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # 不记录查询参数、Cookie、密码或 Authorization。
    log_format upstream '$remote_addr "$request_method $uri" status=$status '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'request_time=$request_time';
    access_log /var/log/nginx/access.log upstream;

    # Docker 内置 DNS；扩缩容后重新发现 backend 的多个 A 记录。
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream after_sales_backend {
        zone after_sales_backend 64k;
        server backend:8080 resolve max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 12m;

        # 仅检查 Nginx；后端检查请用 /actuator/health。
        location = /gateway-healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://after_sales_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            # 覆盖客户端伪造的转发头；后端只信任本 Nginx 的固定内网 IP。
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded "";

            proxy_connect_timeout 3s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_buffering off;
            # 不开启 non_idempotent，避免重放已发给上游的登录/写入请求。
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # 本机演示用：可直接观察每次请求的实际处理实例。
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
