events { worker_connections 1024; }
http {
    server_tokens off;
    # 仅记录路径和服务地址，不记录查询参数、Cookie 或内部服务凭证。
    log_format services '$remote_addr $request_method $uri $status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log services;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 80;
        client_max_body_size 12m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Service-Token "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_buffering off;
        # 不重试写请求，也不把故障路由到其他业务服务。
        proxy_next_upstream off;
        add_header X-Upstream-Addr $upstream_addr always;

        set $auth http://auth-service:8080;
        set $orders http://order-service:8080;
        set $knowledge http://knowledge-service:8080;
        set $agent http://agent-service:8080;
        location = /gateway-healthz { return 200 "ok\n"; }
        location = /health/auth { proxy_pass $auth/actuator/health; }
        location = /health/orders { proxy_pass $orders/actuator/health; }
        location = /health/knowledge { proxy_pass $knowledge/actuator/health; }
        location = /health/agent { proxy_pass $agent/actuator/health; }
        location = /actuator/health { proxy_pass $auth/actuator/health; }
        location ^~ /internal/ { return 404; }
        location ~ ^/api/v1/auth(?:/|$) { proxy_pass $auth$request_uri; }
        location ~ ^/api/v1/(products|orders)(?:/|$) { proxy_pass $orders$request_uri; }
        location ~ ^/api/v1/knowledge(?:/|$) { proxy_pass $knowledge$request_uri; }
        location ~ ^/api/v1/(conversations|runs|confirmations|tickets|evaluations)(?:/|$) {
            proxy_pass $agent$request_uri;
        }
        location / { return 404; }
    }
}
