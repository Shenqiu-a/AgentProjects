spring:
  application:
    name: auth-service
  config:
    import: "optional:file:.env.microservices[.properties],optional:file:../../.env.microservices[.properties]"
  datasource:
    url: "${AUTH_DATABASE_URL:jdbc:postgresql://127.0.0.1:55431/after_sales_auth}"
    username: "${AUTH_DATABASE_USERNAME:after_sales_auth}"
    password: "${AUTH_DATABASE_PASSWORD:}"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 3000
  jdbc:
    template:
      query-timeout: 3s
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  web:
    error:
      include-message: never
      include-stacktrace: never
  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:56379}"
      password: "${REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 1s
  session:
    timeout: 30m
    data:
      redis:
        namespace: after-sales:microservices:session
        repository-type: default

server:
  address: "${SERVER_ADDRESS:127.0.0.1}"
  port: "${SERVER_PORT:8081}"
  shutdown: graceful
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: "${SESSION_COOKIE_SECURE:false}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  services:
    auth-url: "${AUTH_SERVICE_URL:http://127.0.0.1:8081}"
    auth-token: "${SERVICE_AUTH_TOKEN:}"
  security:
    login-rate-limit:
      namespace: after-sales:microservices:login-limit
      ip:
        limit: 30
        window-seconds: 60
      account-ip:
        limit: 5
        window-seconds: 300
      account:
        limit: 20
        window-seconds: 300

